name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/haven-os-ui-design-7hPCX

jobs:
  verify:
    name: typecheck + build
    runs-on: ubuntu-latest

    env:
      # Placeholder values so the Next.js build can run without real secrets.
      # Supabase helpers return null when unconfigured; routes that need real
      # keys are server-rendered on demand and aren't exercised at build time.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ANTHROPIC_API_KEY: placeholder-anthropic-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build
